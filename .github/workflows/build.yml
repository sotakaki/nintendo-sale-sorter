name: build sale page

on:
  schedule:
    - cron: '30 15 * * *'   # 00:30 JST (eショップのセール切替=0:00の直後に取得)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate sale page
        env:
          TZ: Asia/Tokyo
          NINTENDO_SALE_OUT: docs/index.html
          NINTENDO_SALE_TE_OUT: docs/te.html
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          CREATORS_CLIENT_ID: ${{ secrets.CREATORS_CLIENT_ID }}
          CREATORS_CLIENT_SECRET: ${{ secrets.CREATORS_CLIENT_SECRET }}
        run: python nintendo_sale.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/te.html price_history.json steam_cache.json psn_cache.json amazon_cache.json regular_prices.json
          git diff --cached --quiet && exit 0
          git commit -m "update $(TZ=Asia/Tokyo date +%F_%H:%M)"
          git push
